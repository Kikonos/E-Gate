<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Gate Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="E-Gate">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--ink:#12141a;--mute:#6b7280;--line:#e3e5ea;--acc:#5763be;--accbg:#e8eaf8;--warn:#c2410c;--g:#16a34a;--y:#ca8a04;--r:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--card:#171a22;--ink:#eef0f4;--mute:#8b93a3;--line:#262b36;--acc:#6f7bcc;--accbg:#1f2340;--warn:#fb923c;--g:#22c55e;--y:#eab308;--r:#ef4444}}
:root[data-theme="dark"]{--bg:#0d0f14;--card:#171a22;--ink:#eef0f4;--mute:#8b93a3;--line:#262b36;--acc:#6f7bcc;--accbg:#1f2340;--warn:#fb923c;--g:#22c55e;--y:#eab308;--r:#ef4444}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Inter","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:26px;letter-spacing:-.02em;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:5px}
input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:17px}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 18px;background:var(--acc);color:#111;cursor:pointer}
button.ghost{background:transparent;color:var(--mute);font-weight:500;padding:6px 8px}
.dt{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.dt b{font-size:16px}.dt button{padding:8px 16px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.tm{display:flex;justify-content:space-between;align-items:center;gap:10px}.tm small{display:block;color:var(--mute);font-size:12.5px}.tm b{font-size:34px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.hint{font-size:12.5px;color:var(--mute);margin:8px 0 0}
.err{color:var(--warn);font-size:13px;margin:8px 0 0}
.duty.past{opacity:.45}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.day{font-weight:600}.tag{font-size:12px;background:var(--accbg);color:var(--acc);padding:2px 9px;border-radius:99px;font-weight:600}
.wake{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.wake b{font-size:46px;letter-spacing:-.03em;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.wake span{color:var(--mute)}
.steps{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.step{display:flex;justify-content:space-between;padding:5px 0;position:relative}
.step:before{content:"";position:absolute;left:-19px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--line)}
.step.k:before{background:var(--acc)}.step b{font-variant-numeric:tabular-nums}
.warn{color:var(--warn);font-size:13px;margin-top:8px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
</style></head><body><main>
<h1>E-Gate Planner</h1>
<p class="sub">Type your e-gate time. Get your bus and wake-up time.</p>
<div class="card">
  <label>Date</label>
  <div class="dt"><button id="dm" aria-label="Previous day">‹</button><b id="dd"></b><button id="dpl" aria-label="Next day">›</button></div>
  <label for="eg">E-gate time (24h)</label>
  <div class="row"><input id="eg" type="text" inputmode="numeric" pattern="[0-9:]*" maxlength="5" enterkeyhint="done" autocomplete="off"><button id="add">Add</button></div>
  <p class="err" id="er" hidden></p>
  <p class="hint" id="rd"></p>
</div>
<div class="card tm" id="tm" hidden><div><small>Next wake-up</small><span id="tw"></span></div><b id="tt"></b></div>
<div id="list"></div>
<div class="foot"><button class="ghost" id="clr">Clear all</button></div>
<p class="hint">Walk to stop 10 min · getting ready 60 min · bus from SAFA TWR to EGHQ. Data stays on this device.</p>
</main>
<script>
const WALK=10,PREP=60,MAXEARLY=20;
const T="0031-0115 0046-0128 0106-0148 0126-0208 0146-0228 0206-0248 0226-0308 0246-0328 0306-0348 0331-0413 0356-0438 0421-0503 0441-0523 0501-0543 0521-0603 0541-0623 0601-0645 0621-0705 0641-0725 0701-0745 0721-0805 0744-0828 0804-0848 0824-0908 0844-0928 0904-0948 0924-1008 0949-1033 1014-1058 1039-1123 1104-1148 1129-1213 1154-1238 1219-1303 1244-1328 1309-1353 1334-1418 1359-1443 1424-1508 1449-1533 1514-1558 1539-1623 1604-1648 1624-1708 1644-1728 1704-1748 1724-1808 1744-1828 1804-1848 1829-1918 1854-1943 1919-2008 1944-2033 2009-2058 2034-2123 2059-2148 2124-2213 2149-2233 2214-2258 2239-2323 2259-2343 2319-0003 2339-0023 2359-0043 0016-0100".split(" ").map(s=>{const m=x=>+x.slice(0,2)*60+ +x.slice(2),d=m(s.slice(0,4)),r=m(s.slice(5));return{d,dur:(r-d+1440)%1440}});
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
let duties=[];
try{const r=JSON.parse(localStorage.getItem("egp")||"{}");duties=(r.duties||[]).map(d=>d.t)}catch(e){}
const save=()=>{try{localStorage.setItem("egp",JSON.stringify({duties:duties.map(t=>({t}))}))}catch(e){}};
const hm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const dl=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
function plan(ms){
  const e=new Date(ms),day0=new Date(e.getFullYear(),e.getMonth(),e.getDate()).getTime(),E=(ms-day0)/60000;
  let b=null;
  for(const o of[-1,0])for(const t of T){const dep=o*1440+t.d,arr=dep+t.dur;if(arr<=E&&(!b||arr>b.arr))b={dep,arr}}
  const at=m=>new Date(day0+m*60000),dep=at(b.dep);
  const prev=T.flatMap(t=>[-1,0].map(o=>o*1440+t.d)).filter(x=>x<b.dep).sort((a,c)=>c-a)[0];
  return{egate:e,dep,arr:at(b.arr),gap:E-b.arr,leave:new Date(dep-WALK*6e4),wake:new Date(dep-(WALK+PREP)*6e4),backup:at(prev)};
}
const DEF="Type 4 digits, e.g. 1430. A short 615 reads as 06:15. The date moves on a day after each add.";
let cur=new Date();cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate());
const showDate=()=>{$("dd").textContent=dl(cur)};
const step=n=>{cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+n);showDate()};
function norm(s){s=s.replace(/[^\d:]/g,"");let h,m;
  if(s.includes(":")){const p=s.split(":");if(p.length!==2||!p[0]||p[0].length>2||p[1].length!==2)return null;h=+p[0];m=+p[1]}
  else if(s.length===3){h=+s[0];m=+s.slice(1)}else if(s.length===4){h=+s.slice(0,2);m=+s.slice(2)}else return null;
  return h>23||m>59?null:{h,m}}
function render(){
  const now=Date.now(),L=[...duties].sort((a,b)=>a-b),nxt=L.findIndex(t=>plan(t).wake.getTime()>now);
  $("list").innerHTML=L.length?L.map((t,i)=>{
    const p=plan(t),past=t<=now,r=Math.round((p.egate-p.wake)/6e4),df=x=>x.getDate()!==p.egate.getDate()?" ("+dl(x)+")":"";
    return`<div class="card duty ${past?"past":""}"><div class="head"><span class="day">${dl(p.egate)}</span>${i===nxt?'<span class="tag">Next</span>':""}</div>
    <div class="wake"><b>${hm(p.wake)}</b><span>wake up${df(p.wake)}</span></div>
    <div class="steps">
      <div class="step"><span>Leave home</span><b>${hm(p.leave)}</b></div>
      <div class="step k"><span>Bus from SAFA TWR</span><b>${hm(p.dep)}</b></div>
      <div class="step"><span>Arrive EGHQ</span><b>${hm(p.arr)}</b></div>
      <div class="step k"><span>E-gate</span><b>${hm(p.egate)}</b></div>
    </div>
    ${p.gap>MAXEARLY?`<div class="warn">No bus lands within ${MAXEARLY} min of e-gate. Best option arrives ${p.gap} min early.</div>`:""}
    <div class="hint">Arrive ${p.gap} min early · wake ${Math.floor(r/60)}h${pad(r%60)} before e-gate · backup bus ${hm(p.backup)}</div>
    <div class="foot"><span></span><button class="ghost" data-x="${t}">Remove</button></div></div>`}).join("")
  :'<div class="card empty">No e-gates yet. Type your first one above.</div>';
}
function tick(){
  const now=Date.now(),w=duties.map(t=>plan(t).wake).filter(d=>d>now).sort((a,b)=>a-b)[0],el=$("tm");
  if(!w){el.hidden=true;return}
  el.hidden=false;const ms=w-now,h=ms/36e5,tot=Math.floor(ms/1000),c=h<=4?"var(--r)":h<=12?"var(--y)":h<=24?"var(--g)":"var(--mute)";
  $("tt").textContent=Math.floor(tot/3600)+":"+pad(Math.floor(tot%3600/60))+":"+pad(tot%60);
  $("tw").textContent=dl(w)+" · "+hm(w);$("tt").style.color=c;el.style.borderColor=c;
}
function add(){
  const n=norm($("eg").value),er=$("er");
  if(!n){er.textContent="Enter a 24h time like 1430 or 6:15.";er.hidden=false;$("eg").focus();return}
  er.hidden=true;
  const t=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate(),n.h,n.m).getTime();
  if(!duties.includes(t))duties.push(t);
  $("eg").value="";$("rd").textContent=DEF;step(1);save();render();tick();$("eg").focus();
}
$("eg").oninput=()=>{let v=$("eg").value.replace(/[^\d:]/g,"");
  if(v.includes(":")){const i=v.indexOf(":");v=(v.slice(0,i+1)+v.slice(i+1).replace(/:/g,"")).slice(0,5)}
  else{v=v.slice(0,4);if(v.length===4)v=v.slice(0,2)+":"+v.slice(2)}
  $("eg").value=v;const n=norm(v);$("rd").textContent=n?"Reads as "+pad(n.h)+":"+pad(n.m):DEF};
$("add").onclick=add;
$("eg").onkeydown=e=>{if(e.key==="Enter")add()};
$("dm").onclick=()=>step(-1);$("dpl").onclick=()=>step(1);
$("list").onclick=e=>{const x=e.target.dataset.x;if(x){duties=duties.filter(t=>t!==+x);save();render();tick()}};
$("clr").onclick=()=>{if(confirm("Remove all e-gates?")){duties=[];save();render();tick()}};
$("rd").textContent=DEF;showDate();render();tick();setInterval(()=>{tick()},1000);
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
